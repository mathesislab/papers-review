name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    # one draft release for the build to upload to. A manual run needs a tag
    # selected: the release is named after the ref.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find_draft() {
            gh api "repos/$GITHUB_REPOSITORY/releases" \
              --jq ".[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\") | .id" | head -1
          }
          id=$(find_draft)
          if [ -z "$id" ]; then
            # the id from the answer: a new draft is not listed at once
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" -f name="$GITHUB_REF_NAME" -F draft=true --jq .id)
          fi
          # without an id, the build would skip its uploads
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    # macOS only: the PDF view is PDFKit
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # not code-signed or notarized; a person reviews the draft before publishing.
      # The updates are signed with the key of the updater (its public key is in
      # tauri.conf.json); latest.json tells the apps about them. File names without
      # the version: the website may link to the latest release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          includeUpdaterJson: true
          assetNamePattern: Papers-Review-macos-[arch][ext]
          tauriScript: npm run tauri
          args: --bundles app,dmg
