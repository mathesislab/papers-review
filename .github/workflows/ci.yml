name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS first: the PDF view is PDFKit
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: npm run check
      - run: npm test
      # the Tauri crate embeds ./build, so the frontend comes before clippy and the tests
      - run: npm run build

      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
