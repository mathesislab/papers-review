<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>papers-review mockups</title>
<style>
  :root {
    --bg: #ffffff; --side: #f4f4f6; --fg: #1d1d1f; --muted: #6e6e73; --line: #e3e3e8;
    --accent: #2f6fdf; --on-accent: #fff; --sel: #dfe9fb; --chip: #eef1f6; --pdf: #e4e4e9;
    --paper: #ffffff; --ink: #1f1f1f; --ink2: #8a8a8a; --pdfsel: rgba(70, 140, 255, .32);
    --glass: rgba(250, 250, 252, .9); --glass-line: rgba(0, 0, 0, .12);
    --shadow: 0 10px 30px rgba(0, 0, 0, .16), 0 1px 3px rgba(0, 0, 0, .12);
    --md-h: #2f6fdf; --md-q: #5f5f66; --md-loc: #b25d12; --md-sym: #23875c;
    --project: #d9822b; --titlebg: var(--side); --dim: rgba(0, 0, 0, .25);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e20; --side: #252528; --fg: #ececf0; --muted: #9a9aa2; --line: #38383d;
      --accent: #5b8ff0; --sel: rgba(58, 120, 230, .35); --chip: #303036; --pdf: #2a2a2e;
      --glass: rgba(38, 38, 42, .92); --glass-line: rgba(255, 255, 255, .12);
      --shadow: 0 10px 30px rgba(0, 0, 0, .5);
      --md-h: #7ea6f5; --md-q: #b4b4bc; --md-loc: #e0a060; --md-sym: #5cc596; --dim: rgba(0, 0, 0, .45);
    }
  }
  body.tint { --titlebg: color-mix(in srgb, var(--project) 16%, var(--side)); }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
    font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .lede { color: var(--muted); margin: 0 0 12px; max-width: 80ch; }
  .switch { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .switch button { font: inherit; padding: 4px 11px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg); cursor: pointer; }
  .switch button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .caption { max-width: 1080px; margin: 12px 0 0; line-height: 1.5; }
  .caption kbd, .key { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-radius: 4px;
    padding: 0 4px; color: var(--muted); background: var(--bg); }
  .fit { width: 1082px; transform-origin: 0 0; }

  /* the window */
  .window { position: relative; width: 1080px; height: 640px; border: 1px solid var(--line); border-radius: 11px;
    overflow: hidden; display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 6px 40px 1fr 24px;
    background: var(--bg); box-shadow: 0 18px 50px rgba(0, 0, 0, .16); }
  .window.nosidebar { grid-template-columns: 1fr; }
  .refs { position: absolute; z-index: 8; left: 50%; top: 14px; transform: translateX(-50%); width: 620px;
    background: var(--glass); border: 1px solid var(--glass-line); box-shadow: var(--shadow); border-radius: 12px;
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); overflow: hidden; }
  .refs .q { display: flex; gap: 8px; align-items: center; padding: 10px 14px; font-size: 15px; border-bottom: 1px solid var(--glass-line); }
  .refs .q .src { margin-left: auto; font-size: 11.5px; color: var(--muted); }
  .refs .r { display: grid; grid-template-columns: 42px 1fr auto; gap: 10px; padding: 6px 14px; align-items: center; }
  .refs .r.sel { background: var(--accent); color: var(--on-accent); }
  .refs .r .y { color: var(--muted); font-variant-numeric: tabular-nums; }
  .refs .r.sel .y, .refs .r.sel small { color: var(--on-accent); }
  .refs .r small { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .refs .r b { font-weight: 600; }
  .refs .foot { display: flex; gap: 14px; padding: 6px 14px; border-top: 1px solid var(--glass-line); color: var(--muted); font-size: 11.5px; }
  .pbar { grid-column: 1 / -1; background: var(--project); cursor: context-menu; }
  .titlebar { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 12px;
    background: var(--titlebg); border-bottom: 1px solid var(--line); white-space: nowrap; }
  .lights { display: flex; gap: 7px; margin-right: 8px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .tb-icon { color: var(--muted); display: flex; }
  .tb-title { flex: 1; display: flex; gap: 8px; align-items: baseline; overflow: hidden; }
  .tb-title span { color: var(--muted); }
  .tool { height: 26px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg);
    color: var(--fg); display: flex; align-items: center; gap: 6px; }
  .tool.on { background: var(--sel); border-color: transparent; }
  .status { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; padding: 0 12px;
    border-top: 1px solid var(--line); background: var(--side); color: var(--muted); font-size: 11.5px; }

  .side { background: var(--side); border-right: 1px solid var(--line); overflow: hidden; padding: 6px 0;
    display: flex; flex-direction: column; }
  .side h4 { margin: 12px 14px 3px; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
  .side .item { display: flex; align-items: center; gap: 7px; padding: 3px 10px; border-radius: 6px; margin: 0 6px;
    white-space: nowrap; }
  .side .item.sub { padding-left: 28px; }
  .side .item .n { margin-left: auto; color: var(--muted); font-size: 11.5px; }
  .side .item.sel { background: var(--sel); }
  .side .add { color: var(--muted); margin: 8px 16px 0; }
  .side .due { margin-top: auto; padding: 8px 14px; border-top: 1px solid var(--line); color: var(--muted);
    display: flex; gap: 8px; align-items: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--project); }
  .ft { font: 600 8.5px/1 -apple-system, sans-serif; padding: 3px 3px; border-radius: 3px; color: #fff; width: 24px;
    text-align: center; flex: none; }
  .ft.pdf { background: #d04545; } .ft.md { background: #4a76d6; } .ft.jl { background: #8a5cd6; }
  .ft.dir { background: #9a9aa2; } .ft.ext { background: #2f9e6e; }

  .main { position: relative; overflow: hidden; }
  .pdfarea { position: absolute; inset: 0; background: var(--pdf); display: flex; justify-content: center;
    padding-top: 18px; overflow: hidden; }
  .page { position: relative; background: var(--paper); color: var(--ink); width: 560px; height: 980px; flex: none;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .2); padding: 30px 52px 0 70px;
    font: 12.5px/20px "Times New Roman", Times, Georgia, serif; transform: translateY(var(--scroll, 0)); }
  .page .runhead { font: 8px/1.3 -apple-system, sans-serif; color: var(--ink2); margin-bottom: 18px; }
  .page .l { position: relative; white-space: nowrap; }
  .page .l::before { content: attr(data-n); position: absolute; left: -46px; width: 26px; text-align: right;
    font: 8.5px/20px -apple-system, sans-serif; color: var(--ink2); }
  .page .hd { font-weight: bold; }
  .page .gap { height: 10px; }
  .page mark { background: var(--pdfsel); color: inherit; }

  /* the review pane, floating over the viewer */
  .pane { position: absolute; z-index: 5; background: var(--glass); border: 1px solid var(--glass-line);
    box-shadow: var(--shadow); border-radius: 10px; display: flex; flex-direction: column; overflow: hidden;
    -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4); }
  .pane.bottom { left: 10px; right: 10px; bottom: 10px; height: 47%; }
  .pane.right { top: 10px; right: 10px; bottom: 10px; width: 392px; }
  .pane.bottom::before, .pane.right::before { content: ""; position: absolute; background: var(--muted);
    opacity: .35; border-radius: 2px; }
  .pane.bottom::before { top: 3px; left: 50%; width: 36px; height: 3px; margin-left: -18px; }
  .pane.right::before { left: 3px; top: 50%; width: 3px; height: 36px; margin-top: -18px; }
  .pane-head { display: flex; align-items: center; gap: 8px; padding: 9px 8px 6px 12px;
    border-bottom: 1px solid var(--glass-line); white-space: nowrap; }
  .pane-head .meta { margin-left: auto; color: var(--muted); font-size: 11.5px; }
  .ib { color: var(--muted); display: flex; padding: 3px; border-radius: 5px; }
  .ib:hover { background: var(--chip); }
  .seg { display: inline-flex; background: var(--chip); border-radius: 7px; padding: 2px; }
  .seg span { padding: 2px 10px; border-radius: 5px; font-size: 12px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .seg span.on { background: var(--bg); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, .15); }
  .editor { flex: 1; overflow: auto; padding: 10px 18px 14px; white-space: pre-wrap; font: 13px/1.6 -apple-system, sans-serif; }
  .mk { color: var(--muted); opacity: .75; font-weight: 400; }
  .h { font-weight: 650; color: var(--md-h); }
  .loc { color: var(--md-loc); font-weight: 650; }
  .q { color: var(--md-q); font-style: italic; }
  .sym { color: var(--md-sym); font-weight: 650; }
  .new { background: color-mix(in srgb, var(--accent) 16%, transparent); border-radius: 3px; }
  .cursor { display: inline-block; width: 1.5px; height: 15px; background: var(--accent); vertical-align: -3px;
    animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .pane-foot { padding: 4px 12px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--glass-line);
    display: flex; gap: 14px; white-space: nowrap; overflow: hidden; }
  .strip { position: absolute; z-index: 5; left: 50%; bottom: 12px; transform: translateX(-50%); background: var(--glass);
    border: 1px solid var(--glass-line); box-shadow: var(--shadow); border-radius: 16px; padding: 5px 14px;
    display: flex; gap: 10px; align-items: center; white-space: nowrap; color: var(--muted); }
  .strip b { color: var(--fg); font-weight: 500; }

  /* popovers, menus, sheets */
  .pop { position: absolute; z-index: 8; background: var(--glass); border: 1px solid var(--glass-line); box-shadow: var(--shadow);
    border-radius: 9px; padding: 5px; -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); color: var(--fg); }
  .pop.row { display: flex; gap: 2px; font: 12px -apple-system, sans-serif; }
  .pop.row span { padding: 4px 9px; border-radius: 5px; white-space: nowrap; }
  .pop.row span.on { background: var(--accent); color: var(--on-accent); }
  .pop.row .key { margin-left: 4px; }
  .pop.row span.on .key { color: var(--on-accent); border-color: rgba(255, 255, 255, .5); background: transparent; }
  .symbols { width: 520px; padding: 10px 14px 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 18px;
    font-size: 12px; }
  .symbols h5 { grid-column: 1 / -1; margin: 6px 0 0; font-size: 11px; color: var(--muted); font-weight: 600; }
  .symbols div { display: flex; justify-content: space-between; gap: 8px; }
  .symbols code { font: 11.5px ui-monospace, Menlo, monospace; color: var(--muted); }
  .symbols .out { font-weight: 600; color: var(--md-sym); }
  .symbols .wide { grid-column: span 3; justify-content: flex-start; gap: 10px; color: var(--muted); }
  .ctx { width: 236px; font-size: 13px; padding: 5px; }
  .ctx .mi { padding: 4px 10px 4px 24px; border-radius: 5px; position: relative; cursor: default; }
  .ctx .mi:hover { background: var(--accent); color: var(--on-accent); }
  .ctx .mi.check::before { content: "✓"; position: absolute; left: 8px; }
  .ctx .hdr { padding: 3px 10px; font-size: 11px; color: var(--muted); }
  .ctx .sw { display: flex; gap: 7px; padding: 4px 10px 6px; }
  .ctx .sw i { width: 17px; height: 17px; border-radius: 50%; display: block; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
  .ctx .sw i.on { outline: 2px solid var(--fg); outline-offset: 1px; }
  .ctx hr { border: 0; border-top: 1px solid var(--glass-line); margin: 4px 6px; }
  #menu { position: fixed; display: none; }
  .scrim { position: absolute; inset: 0; background: var(--dim); z-index: 9; }
  .sheet { position: absolute; z-index: 10; left: 50%; top: 46px; transform: translateX(-50%); background: var(--bg);
    border: 1px solid var(--line); border-radius: 0 0 12px 12px; box-shadow: var(--shadow); padding: 18px 20px 16px; }
  .sheet h3 { margin: 0 0 12px; font-size: 14px; }
  .sheet .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .btn { padding: 4px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); }
  .btn.pri { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .form { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; align-items: center; }
  .form label { color: var(--muted); text-align: right; }
  .field { border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; background: var(--bg); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .field.read::after { content: "from the PDF"; float: right; font-size: 10.5px; color: var(--md-sym); margin-left: 8px; }
  .cb { display: flex; gap: 7px; align-items: center; }
  .cb i { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line); display: inline-grid; place-items: center;
    font-style: normal; font-size: 10px; }
  .cb i.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tree { font: 11.5px/1.6 ui-monospace, Menlo, monospace; color: var(--muted); background: var(--side); border-radius: 6px;
    padding: 8px 12px; white-space: pre; }
  .drop { border: 2px dashed var(--line); border-radius: 10px; padding: 14px; display: flex; gap: 14px; align-items: center;
    margin-bottom: 14px; }
  .drop .doc { width: 42px; height: 54px; background: var(--paper); border: 1px solid var(--line); border-radius: 3px; position: relative; }
  .drop .doc::after { content: "PDF"; position: absolute; bottom: 5px; left: 5px; right: 5px; background: #d04545; color: #fff;
    font: 600 8px/14px sans-serif; text-align: center; border-radius: 2px; }
  .a4 { width: 252px; height: 356px; background: var(--paper); color: var(--ink); box-shadow: 0 1px 5px rgba(0, 0, 0, .25);
    padding: 22px 22px; font: 6.6px/1.5 Georgia, serif; overflow: hidden; flex: none; }
  .a4 b { font-family: -apple-system, sans-serif; }
  .a4 .t { font: 600 10px/1.3 -apple-system, sans-serif; }
  .a4 .s { font: 7px/1.4 -apple-system, sans-serif; color: #777; margin-bottom: 10px; }
  .a4 h6 { font: 600 7.5px -apple-system, sans-serif; margin: 8px 0 3px; }

  /* text files */
  .textarea { position: absolute; inset: 0; overflow: hidden; background: var(--bg); padding: 26px 0 0; }
  .textarea .doc { width: 680px; margin: 0 auto; line-height: 1.55; }
  .textarea .rendered h2 { font-size: 20px; margin: 0 0 10px; }
  .textarea .rendered h3 { font-size: 15px; margin: 18px 0 6px; }
  .textarea .rendered code { font: 12px ui-monospace, Menlo, monospace; background: var(--chip); padding: 1px 4px; border-radius: 4px; }
  .textarea .rendered pre { background: var(--chip); padding: 10px 12px; border-radius: 6px; }
  .textarea .rendered pre code { background: none; padding: 0; }
  .textarea .source { font: 12.5px/1.65 ui-monospace, Menlo, monospace; white-space: pre-wrap; display: none; }
  .textarea.raw .rendered { display: none; } .textarea.raw .source { display: block; }

  /* mission control */
  .desk { width: 1080px; height: 640px; border-radius: 11px; overflow: hidden; position: relative;
    background: radial-gradient(circle at 30% 20%, #4c6a8f, #1d2a3c 70%); display: flex; flex-wrap: wrap;
    align-content: center; justify-content: center; gap: 38px 34px; padding: 30px; }
  .mini { width: 290px; }
  .mini .w { height: 184px; border-radius: 6px; overflow: hidden; background: #fff; display: grid;
    grid-template-columns: 52px 1fr; grid-template-rows: 4px 13px 1fr; box-shadow: 0 8px 22px rgba(0, 0, 0, .4); }
  .mini .b { grid-column: 1 / -1; }
  .mini .tt { grid-column: 1 / -1; background: #f1f1f3; border-bottom: 1px solid #e0e0e4; }
  .mini .sd { background: #f4f4f6; border-right: 1px solid #e3e3e8; padding: 6px 5px; }
  .mini .sd i, .mini .ct i { display: block; height: 3px; background: #d6d6dc; border-radius: 2px; margin-bottom: 5px; }
  .mini .ct { background: #e4e4e9; position: relative; padding: 6px 30px; }
  .mini .ct .pg { background: #fff; height: 100%; padding: 8px 10px; }
  .mini .ct .pg i { background: #c9c9cf; height: 2px; margin-bottom: 4px; }
  .mini .ct .pn { position: absolute; left: 4px; right: 4px; bottom: 4px; height: 46%; background: rgba(250, 250, 252, .95);
    border-radius: 3px; box-shadow: 0 1px 4px rgba(0, 0, 0, .25); padding: 6px 8px; }
  .mini .ct .pn i { background: #b8c6e6; height: 2px; }
  .mini .lab { color: #fff; text-align: center; margin-top: 8px; font-size: 12px; text-shadow: 0 1px 3px rgba(0, 0, 0, .6);
    display: flex; justify-content: center; gap: 6px; align-items: center; }
  .mini .lab .ai { width: 16px; height: 16px; border-radius: 4px; display: inline-block; }
</style>
</head>
<body>
<h1>papers-review: mock-ups</h1>
<p class="lede">A review project is a folder. The PDF shows in PDFKit, as Preview shows it, and a Markdown review floats over it, at the bottom or on the right. Right-click the coloured bar at the top of any window to change its colour.</p>
<div class="switch" id="switch"></div>
<div id="stage"></div>
<p class="caption" id="caption"></p>
<div class="pop ctx" id="menu"></div>

<script>
const I = {
  side: '<svg width="16" height="14" viewBox="0 0 16 14" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1" y="1" width="14" height="12" rx="2"/><line x1="6" y1="1" x2="6" y2="13"/></svg>',
  dockB: '<svg width="15" height="13" viewBox="0 0 16 14" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1" y="1" width="14" height="12" rx="2"/><rect x="2" y="8" width="12" height="4" rx="1" fill="currentColor" stroke="none" opacity=".6"/></svg>',
  dockR: '<svg width="15" height="13" viewBox="0 0 16 14" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1" y="1" width="14" height="12" rx="2"/><rect x="9" y="2" width="5" height="10" rx="1" fill="currentColor" stroke="none" opacity=".6"/></svg>',
  exp: '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M7 1v8M3.5 5.5 7 9l3.5-3.5M2 12.5h10"/></svg>',
  close: '<svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.4"><path d="M2 2l8 8M10 2l-8 8"/></svg>',
  pen: '<svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M9.5 2.5l2 2L5 11H3V9z"/></svg>',
};
const COLORS = ['#d9822b', '#d64545', '#d6457f', '#8a5cd6', '#2f6fdf', '#1f9bb0', '#2f9e6e', '#c9a227', '#8e8e93'];

const LINES = [
  [118, 'To test how robust the threshold is, we repeat the overshoot ensemble with'],
  [119, 'the basal melt parameter γ scaled by factors between 0.5 and 2.0 (Table 2).'],
  [120, 'All other parameters are held at their reference values. Each member is'],
  [121, 'run for 5000 years, long enough for the grounding line to settle in a new'],
  [122, 'position in all but the weakest forcing cases (Fig. 6).'],
  [123, 'Across the ensemble, <SEL123>the threshold is crossed at 1.8 °C of global warming</SEL123>'],
  [124, 'above pre-industrial, with little dependence on the melt rate. Stronger melt'],
  [125, 'shortens the time to retreat but does not move the threshold itself. This'],
  [126, 'differs from earlier studies that found a strong melt dependence (e.g.'],
  [127, 'Author et al., 2021), which we attribute to the coarser resolution of the'],
  [128, 'grounding zone in those models. At 2 km resolution the retreat is set mainly'],
  [129, 'by the bed topography landward of the present grounding line, and melt acts'],
  [130, 'only to trigger it.'],
  'gap', [131, '<span class="hd">3.5 Reversibility</span>'], 'gap',
  [132, 'Once retreat has started, lowering the temperature back below the threshold'],
  [133, 'does not restore the ice sheet within the simulated period. Recovery needs'],
  [134, 'cooling of at least 1.2 °C below the threshold, a hysteresis width consistent'],
  [135, 'with the bedrock slope in the deepest basins. We note, however, that'],
  [136, '<SEL136>ice-shelf buttressing is negligible beyond 2100 in all members</SEL136>, which limits'],
  [137, 'the regrowth of the shelves and may bias the hysteresis width upward.'],
  [138, 'Figure 7 shows the ice volume along the cooling branch for three members.'],
  [139, 'The fastest regrowth occurs where the bed rises inland, as in the north-east,'],
  [140, 'where the ice sheet regains about half of its lost volume after 3000 years.'],
  [141, 'Elsewhere regrowth stalls once the margin reaches the coast.'],
  'gap', [142, '<span class="hd">4 Discussion</span>'], 'gap',
  [143, 'Our results place the threshold for long-term loss of the ice sheet close to'],
  [144, 'the upper end of earlier estimates, but within the range of the most recent'],
  [145, 'multi-model assessments. The main sources of uncertainty are the surface'],
  [146, 'mass balance scheme, the bed topography in the deep basins and the response'],
  [147, 'of the ocean circulation to the freshwater released by the retreat.'],
];

function page(sel, scroll) {
  const body = LINES.map(l => {
    if (l === 'gap') return '<div class="gap"></div>';
    let t = l[1];
    for (const n of [123, 136]) {
      t = t.replace(`<SEL${n}>`, sel === n ? '<mark>' : '').replace(`</SEL${n}>`, sel === n ? '</mark>' : '');
    }
    return `<div class="l" data-n="${l[0]}">${t}</div>`;
  }).join('');
  return `<div class="pdfarea"><div class="page" style="--scroll:${scroll || 0}px">

}

const m = s => `<span class="mk">${s}</span>`;
function editor(variant) {
  let t =
`<span class="h">${m('## ')}Round 2 — 2 November 2026</span>

<span class="h">${m('### ')}General comments</span>

The authors have addressed most of my earlier concerns. The new melt sensitivity ensemble (Sect. 3.4) strengthens the main conclusion: stronger basal melt <span class="sym">→</span> earlier retreat, but not a different threshold.

<span class="h">${m('### ')}Specific comments</span>

<span class="loc">${m('**')}p. 5, l. 123:${m('**')}</span> <span class="q">“the threshold is crossed at 1.8 °C of global warming”</span>
<span class="sym">→</span> Please give the ensemble range here, as in Table 2 (≈ 1.6–2.1 °C?).

<span class="loc">${m('**')}p. 5, l. 127:${m('**')}</span> The earlier study used a 5 km grid, not 10 km <span class="sym">⇒</span> the resolution argument needs care.
`;
  if (variant === 'quoted')
    t += `
<span class="loc new">${m('**')}p. 5, l. 136:${m('**')}</span> <span class="q new">“ice-shelf buttressing is negligible beyond 2100 in all members”</span>
<span class="cursor"></span>`;
  else if (variant === 'typing')
    t += `
<span class="loc">${m('**')}p. 5, l. 136:${m('**')}</span> <span class="q">“ice-shelf buttressing is negligible beyond 2100 in all members”</span>
Is this a result or a model limitation? If the shelves cannot regrow, the hysteresis width is an upper bound <span class="sym">→</span> please say so in the abstract. Width <span class="sym">≥</span> 1 °C in all members, Δ<span class="cursor"></span>`;
  else t += '<span class="cursor"></span>';
  return t;
}

function pane(mode, variant) {

  const dock = mode === 'bottom' ? I.dockR : I.dockB;
  return `<div class="pane ${mode}">
    <div class="pane-head">
      <div class="seg"><span>Round 1 · sent 12 Jul</span><span class="on">Round 2 · draft</span></div>

let current = 0;
function show(i) {
  current = i;
  document.querySelectorAll('#switch button').forEach((b, j) => b.classList.toggle('on', j === i));
  document.getElementById('stage').innerHTML = `<div class="fit">${VIEWS[i][1]()}</div>`;
  document.getElementById('caption').innerHTML = VIEWS[i][2];
  const t = document.getElementById('mdtoggle');
  if (t) t.querySelectorAll('span').forEach((s, j) => s.onclick = () => {
    t.querySelectorAll('span').forEach((x, k) => x.classList.toggle('on', k === j));
    document.getElementById('tv').classList.toggle('raw', j === 1);
  });
  // the editor shows its end, where the cursor is
  document.querySelectorAll('.editor').forEach(e => e.scrollTop = e.scrollHeight);
  document.querySelectorAll('.window .ctx .sw i[data-c]').forEach(bindSwatch);
  document.querySelectorAll('.window .ctx .mi[data-act]').forEach(bindAct);
  fit();
}
function fit() {
  const f = document.querySelector('.fit');
  if (!f) return;
  const s = Math.min(1, (document.body.clientWidth - 32) / 1082);
  f.style.transform = `scale(${s})`;
  f.style.height = `${642 * s}px`;
}
function setColor(c) {
  document.body.style.setProperty('--project', c);
  document.querySelectorAll('.pbar').forEach(b => b.style.display = '');
}
function bindSwatch(i) { i.onclick = () => { setColor(i.dataset.c); hideMenu(); show(current); }; }
function bindAct(el) {
  el.onclick = () => {
    if (el.dataset.act === 'tint') document.body.classList.toggle('tint');
    if (el.dataset.act === 'none') document.body.style.setProperty('--project', 'transparent');
    hideMenu(); show(current);
  };
}
const menuEl = document.getElementById('menu');
function hideMenu() { menuEl.style.display = 'none'; }
document.addEventListener('contextmenu', e => {
  if (!e.target.closest('.pbar')) return;
  e.preventDefault();
  menuEl.innerHTML = menu();
  menuEl.style.left = `${e.clientX}px`; menuEl.style.top = `${e.clientY + 4}px`; menuEl.style.display = 'block';
  menuEl.querySelectorAll('.sw i').forEach(bindSwatch);
  menuEl.querySelectorAll('.mi[data-act]').forEach(bindAct);
});
document.addEventListener('click', e => { if (!e.target.closest('#menu')) hideMenu(); });
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') show((current + 1) % VIEWS.length);
  if (e.key === 'ArrowLeft') show((current + VIEWS.length - 1) % VIEWS.length);
});
window.addEventListener('resize', fit);
document.getElementById('switch').innerHTML = VIEWS.map((v, i) => `<button>${v[0]}</button>`).join('');
document.querySelectorAll('#switch button').forEach((b, i) => b.onclick = () => show(i));
show(0);
</script>
