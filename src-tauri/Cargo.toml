[package]
name = "papers-review"
version = "0.4.0"
description = "Review and edit papers: a project folder, the PDF as Preview shows it, a Markdown review floating over it"
authors = ["Alexander Robinson"]
edition = "2024"
license = "MIT"

[lib]
# the `_lib` suffix keeps the name of the library apart from the binary's (Windows)
name = "papers_review_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable: windows of several web views (the page, the review pane over it)
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# the updates: looked for now and then, installed when asked (the menu, the Settings window)
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
tauri-plugin-pdfkit = { git = "https://github.com/mathesislab/tauri-plugin-pdfkit", tag = "v0.4.0" }
papers-review-core = { version = "0.1.0", path = "../crates/core" }
# the windows and their tabs, as Papers Write has them
papers-tabs = { git = "https://github.com/mathesislab/papers-write", rev = "85a8b3ee78308fe35431a6c676d33be6ecbfa458" }
# the references: the .bib files loaded and searched (papers-core, in papers-desktop), and where papers keeps its
# library (papers-rs, at the commit papers-desktop builds with)
papers-core = { git = "https://github.com/mathesislab/papers-desktop", tag = "v0.9.0" }
papers-rs = { git = "https://github.com/mathesislab/papers-rs", rev = "40d17b600c18c1f615e256ea7969ebf1f56e1641" }

# the Trash, for a file of a project moved to it; the export: a web view printed to a PDF, the review as text
# on the pasteboard
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError", "NSDictionary", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPrintInfo", "NSPrintOperation", "NSPasteboard", "NSView", "NSResponder", "NSGraphics"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView"] }
